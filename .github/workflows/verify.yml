name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 10

    steps:
      - name: Install runtime headers and test tools
        run: pacman -Syu --noconfirm fcitx5 jq pkgconf shellcheck

      - uses: actions/checkout@v5

      - name: Check repository
        run: bash tests/test_repository.sh

      - name: Check terminal policy and toggle
        run: bash tests/test_terminal_policy.sh

      - name: Compile Fcitx5 addon
        run: >-
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror
          -Wno-variadic-macros
          -fPIC -shared
          $(pkg-config --cflags Fcitx5Core)
          src/quickemoji.cpp
          -o /tmp/quickemoji.so
          $(pkg-config --libs Fcitx5Core)
